name: Prisma 7 migration

on:
  push:
    paths:
      - .github/workflows/prisma-7-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buddies
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/buddies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Migrate Prisma configuration and client
        run: |
          node <<'NODE'
          import fs from 'node:fs';

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          delete pkg.prisma;
          pkg.dependencies['@prisma/adapter-pg'] = '^7.0.0';
          pkg.dependencies['@prisma/client'] = '^7.0.0';
          pkg.dependencies['dotenv'] = '^17.0.0';
          pkg.dependencies['pg'] = '^8.16.0';
          pkg.devDependencies['@types/pg'] = '^8.15.0';
          pkg.devDependencies['prisma'] = '^7.0.0';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const schemaPath = 'prisma/schema.prisma';
          let schema = fs.readFileSync(schemaPath, 'utf8');
          schema = schema.replace(
            /generator client \{[\s\S]*?\}\s*datasource db \{[\s\S]*?\}/,
            `generator client {\n  provider = "prisma-client"\n  output   = "../src/generated/prisma"\n}\n\ndatasource db {\n  provider = "postgresql"\n}`,
          );
          fs.writeFileSync(schemaPath, schema);

          fs.writeFileSync('prisma.config.ts', `import 'dotenv/config';\nimport { defineConfig, env } from 'prisma/config';\n\nexport default defineConfig({\n  schema: 'prisma/schema.prisma',\n  migrations: {\n    path: 'prisma/migrations',\n    seed: 'node prisma/seed.mjs',\n  },\n  datasource: {\n    // Use the direct Neon connection for CLI migrations when available.\n    url: process.env.DATABASE_URL_UNPOOLED ?? env('DATABASE_URL'),\n  },\n});\n`);

          fs.writeFileSync('src/lib/db.ts', `import { PrismaPg } from '@prisma/adapter-pg';\nimport { PrismaClient } from '@/generated/prisma/client';\n\nconst connectionString = process.env.DATABASE_URL;\n\nif (!connectionString) {\n  throw new Error('DATABASE_URL is required to initialize Prisma Client');\n}\n\nconst globalForPrisma = globalThis as unknown as { prisma?: PrismaClient };\n\nfunction createPrismaClient() {\n  const adapter = new PrismaPg({\n    connectionString,\n    connectionTimeoutMillis: 5_000,\n  });\n\n  return new PrismaClient({ adapter });\n}\n\nexport const prisma = globalForPrisma.prisma ?? createPrismaClient();\n\nif (process.env.NODE_ENV !== 'production') globalForPrisma.prisma = prisma;\n`);
          NODE
      - name: Install Prisma 7 dependencies
        run: npm install
      - name: Validate and generate client
        run: |
          npx prisma validate
          npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json prisma.config.ts prisma/schema.prisma src/lib/db.ts src/generated/prisma
          git commit -m "chore(prisma): migrate from Prisma 6 to 7"
          git push
