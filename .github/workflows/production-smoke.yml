name: Production Smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOYMENT_URL: https://buddies.vercel.app
      EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SMOKE_ATTEMPTS: 36
      SMOKE_INTERVAL_MS: 10000
      SMOKE_REQUEST_TIMEOUT_MS: 8000
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify production deployment
        run: node scripts/smoke-production.mjs
