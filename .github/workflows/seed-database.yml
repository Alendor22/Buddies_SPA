name: Seed database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SEED to continue"
        required: true
        type: string

jobs:
  seed:
    if: ${{ inputs.confirm == 'SEED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      ALLOW_DB_SEED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify database secrets and target
        shell: bash
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL is missing" && exit 1)
          test -n "$DATABASE_URL_UNPOOLED" || (echo "DATABASE_URL_UNPOOLED is missing" && exit 1)

          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const pooled = new URL(process.env.DATABASE_URL);
          const direct = new URL(process.env.DATABASE_URL_UNPOOLED);

          const pooledDb = pooled.pathname.replace(/^\//, '');
          const directDb = direct.pathname.replace(/^\//, '');

          const identity = {
            pooledHost: pooled.hostname,
            pooledDatabase: pooledDb,
            directHost: direct.hostname,
            directDatabase: directDb
          };

          console.log(JSON.stringify(identity));

          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Seed target\n\n- Pooled host: \`${identity.pooledHost}\`\n- Pooled database: \`${identity.pooledDatabase}\`\n- Direct host: \`${identity.directHost}\`\n- Direct database: \`${identity.directDatabase}\`\n\n`
          );

          if (!pooled.hostname.includes('-pooler')) {
            throw new Error('DATABASE_URL must use the Neon pooled host containing -pooler');
          }

          if (direct.hostname.includes('-pooler')) {
            throw new Error('DATABASE_URL_UNPOOLED must use the direct Neon host without -pooler');
          }

          if (pooledDb !== directDb) {
            throw new Error(`Database mismatch: pooled=${pooledDb}, direct=${directDb}`);
          }
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Synchronize database schema
        run: npx prisma db push --skip-generate

      - name: Run deterministic seed
        run: npm run db:seed

      - name: Verify seeded records
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { PrismaClient } from '@prisma/client';

          const prisma = new PrismaClient();
          try {
            const [dogs, users, walks, messages] = await Promise.all([
              prisma.dog.count(),
              prisma.user.count(),
              prisma.walk.count(),
              prisma.message.count()
            ]);

            const counts = { dogs, users, walks, messages };
            console.log(JSON.stringify(counts));

            appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## Seed result\n\n- Dogs: **${dogs}**\n- Users: **${users}**\n- Walks: **${walks}**\n- Messages: **${messages}**\n`
            );

            if (dogs !== 12 || users !== 6 || walks !== 4 || messages !== 3) {
              throw new Error(`Unexpected seed counts: dogs=${dogs}, users=${users}, walks=${walks}, messages=${messages}`);
            }
          } finally {
            await prisma.$disconnect();
          }
          NODE
